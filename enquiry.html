<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Treats Bakery - Enquiry Form</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Sweet Treats Bakery</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Custom Order Enquiry</h2>
        <form action="#" method="post">
            <label for="fullname">Full Name:</label><br>
            <input type="text" id="fullname" name="fullname" required><br><br>

            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="order-type">Order Category:</label><br>
            <select id="order-type" name="order-type">
                <option value="custom-cake">Custom Birthday Cake</option>
                <option value="wedding">Wedding Cake</option>
                <option value="bulk-pastries">Bulk Pastry Order</option>
            </select><br><br>

            <label for="message">Order Details / Special Requests:</label><br>
            <textarea id="message" name="message" rows="4" cols="50"></textarea><br><br>

            <button type="submit">Submit Enquiry</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Sweet Treats Bakery. All rights reserved.</p>
    </footer>

</body>
</html>
