<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Submit your custom cake and catering enquiries to Sweet Treats Bakery.">
    <title>Sweet Treats Bakery - Enquiry</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Sweet Treats Bakery</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Service & Product Enquiry</h2>
        <form id="enquiryForm" onsubmit="handleEnquiry(event)">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone Number (10 digits):</label>
            <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="0821234567" required>

            <label for="enquiryType">Enquiry Type:</label>
            <select id="enquiryType" name="enquiryType" required>
                <option value="">--Select an Option--</option>
                <option value="cake">Custom Birthday/Wedding Cake</option>
                <option value="catering">Event Catering</option>
                <option value="sponsor">Sponsorship / Volunteer</option>
            </select>

            <label for="details">Enquiry Details:</label>
            <textarea id="details" name="details" rows="4" required></textarea>

            <button type="submit">Submit Enquiry</button>
        </form>

        <div id="enquiryResponse" style="margin-top: 1rem; font-weight: bold; color: #5c4033;"></div>
    </main>

    <footer>
        <p>&copy; 2026 Sweet Treats Bakery. All rights reserved.</p>
    </footer>

    <script>
        function handleEnquiry(event) {
            event.preventDefault();
            const type = document.getElementById('enquiryType').value;
            const responseDiv = document.getElementById('enquiryResponse');

            if (type === 'cake') {
                responseDiv.textContent = "Thank you! Custom cake quotes typically range from R350 to R1,200 depending on design complexity. We will confirm date availability via email.";
            } else if (type === 'catering') {
                responseDiv.textContent = "Thank you! Event catering packages start at R1,500. Our team will review your date availability and get back to you.";
            } else {
                responseDiv.textContent = "Thank you for your enquiry! We have received your message and will respond within 24 hours.";
            }
        }
    </script>
</body>
</html>
